<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pappus</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      gap: 8px;
    }
    
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    #canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    
    #canvas-wrapper canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      border-radius: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    
    #shirt-mockup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      z-index: 2;
    }
    #shirt-mockup.active {
      display: block !important;
      animation: fadeIn 0.6s ease;
    }
    
    /* Fallback when image doesn't load */
    #shirt-mockup.fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid rgba(201, 168, 76, 0.3);
      border-radius: 12px;
      min-width: 200px;
      min-height: 200px;
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      letter-spacing: 2px;
      z-index: 2;
    }
    #shirt-mockup.fallback::after {
      content: "👕 PAPPUS ON T-SHIRT";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      line-height: 2;
    }
    #shirt-mockup.fallback .sub {
      display: block;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
  </style>
</head>
<body>

<div id="main-container">
  <div class="title-bar">
    <div class="title"><span class="accent">P</span>appus</div>
  </div>

  <div id="canvas-container">
    <div id="canvas-wrapper">
      <img id="shirt-mockup" src="Pappus.jpg" alt="Pappus on T-Shirt" />
    </div>
  </div>

  <div class="bottom-bar">
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <div class="info-row">
      <div class="info-item">
        <span class="label">background</span>
        <span class="value" id="bgDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">body</span>
        <span class="value" id="bodyDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">hair</span>
        <span class="value" id="hairDisplay">---</span>
      </div>
    </div>

    <div class="description">
      <span class="highlight">pappus</span>
      <span class="sep">·</span>
      <span class="highlight">fractal tree</span>
      <span class="sep">·</span>
      <span class="highlight">12 color palettes</span>
      <span class="sep">·</span>
      <span class="highlight">generative art</span>
    </div>
  </div>
</div>

<script>
// ============================================
// PAPPUS — Fractal Tree Art
// ============================================

console.log('PAPPUS — Loading...');

const ratio = 1 / 1;
const prefix = 'Pappus';

// Random utility
let seed = Math.random() * 2147483647;

function setSeed(newSeed) {
    seed = newSeed;
}

function random() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}

// Color palettes
const backgroundColours = [
    '#FFF8DC', '#F5DEB3', '#F5F5DC', '#DCDCDC',
    '#FFFAFA', '#E0FFFF', '#FFE4C4', '#FFF0F5',
    '#FFE4E1', '#DDA0DD', '#F0F8FF', '#D5D6EA'
];
const backgroundNames = [
    'Cornsilk', 'Wheat', 'Beige', 'Gainsboro',
    'Snow', 'LightCyan', 'Bisque', 'LavenderBlush',
    'MistyRose', 'Plum', 'AliceBlue', 'Pastel Light Blue'
];

const BodyColours = [
    '#A0522D', '#556B2F', '#4682B4', '#8B4513',
    '#800000', '#D2691E', '#571B7E', '#D291BC',
    '#F8B88B', '#8B8000', '#FFFF33', '#6AFB92'
];
const BodycolorNames = [
    'Sienna', 'DarkOliveGreen', 'SteelBlue', 'SaddleBrown',
    'Maroon', 'Chocolate', 'Purple Iris', 'Pastel Violet',
    'Pastel Orange', 'Dark Yellow', 'Neon Yellow', 'Dragon Green'
];

const hairColours = [
    '#00FA9A', '#5F9EA0', '#B0E0E6', '#F4A460',
    '#C0C0C0', '#F0FFF0', '#BC8F8F', '#16E2F5',
    '#FDBD01', '#C04000', '#800517', '#E56E94'
];
const haircolorNames = [
    'MediumSpringGreen', 'CadetBlue', 'PowderBlue', 'SandyBrown',
    'Silver', 'HoneyDew', 'RosyBrown', 'Bright Turquoise',
    'Neon Gold', 'Mahogany', 'Deep Red', 'Blush Red'
];

let features = {};
let resizeTmr = null;
let showingShirt = false;

function setup() {
    const backgroundIndex = Math.floor(random() * backgroundColours.length);
    const BodycolorIndex = Math.floor(random() * BodyColours.length);
    const haircolorIndex = Math.floor(random() * hairColours.length);

    features.backgroundColour = backgroundColours[backgroundIndex];
    features.bodyColour = BodyColours[BodycolorIndex];
    features.hairColour = hairColours[haircolorIndex];
    
    features.backgroundName = backgroundNames[backgroundIndex];
    features.bodyName = BodycolorNames[BodycolorIndex];
    features.hairName = haircolorNames[haircolorIndex];

    document.getElementById('bgDisplay').textContent = features.backgroundName;
    document.getElementById('bodyDisplay').textContent = features.bodyName;
    document.getElementById('hairDisplay').textContent = features.hairName;
}

function drawTree(ctx, startX, startY, length, angle, depth, branchWidth, color1, color2) {
    const maxBranch = 12;
    const maxAngle = 2 * Math.PI / 6;

    const endX = startX + length * Math.cos(angle);
    const endY = startY + length * Math.sin(angle);

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineWidth = branchWidth;
    ctx.lineCap = "round";
    ctx.lineTo(endX, endY);

    if (depth <= 1) {
        ctx.strokeStyle = color1;
    } else {
        ctx.strokeStyle = color2;
    }
    ctx.stroke();

    const newDepth = depth - 1;
    if (!newDepth) return;

    const subBranches = Math.floor(random() * (maxBranch - 1)) + 1;
    const newBranchWidth = branchWidth * 0.618;
    const newLength = length * 0.618;

    for (let i = 0; i < subBranches; i++) {
        const newAngle = angle - maxAngle + random() * maxAngle * 2;
        drawTree(ctx, endX, endY, newLength, newAngle, newDepth, newBranchWidth, color1, color2);
    }
}

function drawCanvas() {
    const canvas = document.getElementById('target');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = features.backgroundColour;
    ctx.fillRect(0, 0, w, h);

    const color1 = features.hairColour;
    const color2 = features.bodyColour;

    const X1 = w / 4 + random() * w / 2;
    const Y1 = 6 * h / 10 + random() * h / 3;
    const Angle1 = -11 * Math.PI / 20 + random() * 2 * Math.PI / 20;

    drawTree(ctx, X1, Y1, w / 4, Angle1, 9, w / 100, color1, color2);
}

function layoutCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    const rect = wrapper.getBoundingClientRect();
    
    const wWidth = rect.width;
    const wHeight = rect.height;
    const dpr = window.devicePixelRatio || 1;

    // Remove existing canvas
    const canvases = wrapper.getElementsByTagName('canvas');
    Array.from(canvases).forEach(c => c.remove());

    // Check if we need to keep shirt visible
    const shirtMockup = document.getElementById('shirt-mockup');
    const isShirtActive = shirtMockup.classList.contains('active');

    let cWidth = wWidth;
    let cHeight = cWidth / ratio;

    if (cHeight > wHeight) {
        cHeight = wHeight;
        cWidth = wHeight * ratio;
    }

    const targetWidth = Math.floor(cWidth * dpr);
    const targetHeight = Math.floor(cHeight * dpr);

    const canvas = document.createElement('canvas');
    canvas.id = 'target';
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    wrapper.appendChild(canvas);

    canvas.style.position = 'absolute';
    canvas.style.width = cWidth + 'px';
    canvas.style.height = cHeight + 'px';
    canvas.style.top = '50%';
    canvas.style.left = '50%';
    canvas.style.transform = 'translate(-50%, -50%)';
    canvas.style.zIndex = '1';

    // Canvas is always visible (behind shirt if shirt is active)
    canvas.style.display = 'block';

    drawCanvas();
}

function downloadCanvas() {
    if (showingShirt) {
        const link = document.createElement('a');
        link.download = 'Pappus_Shirt.png';
        const img = document.getElementById('shirt-mockup');
        if (img && img.src && !img.classList.contains('fallback')) {
            link.href = img.src;
        } else {
            // Fallback: save the artwork
            const canvas = document.getElementById('target');
            if (canvas) link.href = canvas.toDataURL('image/png');
        }
        link.click();
        return;
    }
    
    const canvas = document.getElementById('target');
    if (!canvas) return;
    const link = document.createElement('a');
    const hash = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
    link.download = prefix + '_' + hash + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function regenerate() {
    console.log('Regenerating...');
    setSeed(Math.random() * 2147483647);
    setup();
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = wrapper.querySelector('canvas');
    if (canvas) {
        canvas.remove();
    }
    const shirtMockup = document.getElementById('shirt-mockup');
    shirtMockup.classList.remove('active');
    shirtMockup.classList.remove('fallback');
    showingShirt = false;
    const shirtToggle = document.getElementById('shirtToggle');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    layoutCanvas();
}

// ============================================
// TOGGLE SHIRT - FIXED: overlay on top
// ============================================
function toggleShirt() {
    console.log('Toggle shirt called! Current state:', showingShirt);
    
    // Toggle the state
    showingShirt = !showingShirt;
    
    const canvas = document.getElementById('target');
    const shirtMockup = document.getElementById('shirt-mockup');
    const shirtToggle = document.getElementById('shirtToggle');
    
    console.log('New state:', showingShirt);
    
    if (showingShirt) {
        console.log('Showing shirt mockup (overlay)');
        // Canvas stays visible behind shirt
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
            console.log('Canvas remains visible behind shirt');
        }
        // Show shirt on top
        shirtMockup.classList.add('active');
        shirtMockup.style.zIndex = '2';
        console.log('Shirt mockup shown as overlay');
        // Update button
        shirtToggle.classList.add('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
        console.log('Button updated to: artwork');
    } else {
        console.log('Showing artwork only');
        // Canvas stays visible
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
            console.log('Canvas visible');
        }
        // Hide shirt
        shirtMockup.classList.remove('active');
        console.log('Shirt mockup hidden');
        // Update button
        shirtToggle.classList.remove('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
        console.log('Button updated to: apparel');
    }
}

// ============================================
// INIT
// ============================================
function init() {
    console.log('PAPPUS — Initializing...');
    setup();
    layoutCanvas();
    console.log('PAPPUS — Ready!');

    // Check if shirt image exists
    const shirtImg = document.getElementById('shirt-mockup');
    shirtImg.addEventListener('error', function() {
        console.warn('Pappus.jpg not found — using fallback');
        this.classList.add('fallback');
    });
    
    shirtImg.addEventListener('load', function() {
        console.log('Pappus.jpg loaded successfully!');
        this.classList.remove('fallback');
    });

    // Resize handler
    window.addEventListener('resize', () => {
        clearTimeout(resizeTmr);
        resizeTmr = setTimeout(layoutCanvas, 100);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            downloadCanvas();
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            regenerate();
        }
        if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            toggleShirt();
        }
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            regenerate();
        }
    });

    // BUTTON EVENT LISTENERS
    const controlsBar = document.getElementById('controlsBar');
    const shirtToggleBtn = document.getElementById('shirtToggle');
    
    controlsBar.addEventListener('click', function(e) {
        console.log('Regenerate button clicked');
        regenerate();
    });
    
    controlsBar.addEventListener('touchend', function(e) {
        e.preventDefault();
        console.log('Regenerate button touched');
        regenerate();
    });
    
    shirtToggleBtn.addEventListener('click', function(e) {
        console.log('Shirt toggle button clicked!');
        toggleShirt();
    });
    
    shirtToggleBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        console.log('Shirt toggle button touched!');
        toggleShirt();
    });
    
    console.log('PAPPUS — Event listeners attached');
}

// Start
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// Expose functions globally for debugging
window.regenerate = regenerate;
window.saveImage = downloadCanvas;
window.toggleShirt = toggleShirt;
window.showingShirt = showingShirt;
</script>
</body>
</html>
